[project]
name = "loom-advisor"
version = "0.1.0"
description = "Air-jet loom efficiency advisor: reads loom specs and daily CMPX reports, diagnoses weft-breakage causes, and suggests setting corrections with evidence-based expected effects."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anusha Chakraborty" }]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0.36",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
loom-advisor = "loom_advisor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom requires Depends() in defaults.
"src/loom_advisor/api/main.py" = ["B008"]
