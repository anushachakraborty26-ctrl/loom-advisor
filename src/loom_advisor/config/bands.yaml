# Golden setting bands per yarn profile.
#
# Config is data: tuning these numbers for a new yarn or plant is a file edit,
# not a code change. Every band cites where it came from.
#
# Provenance: PROJECT 1, Alok Industries terry weaving shed, June 2025 —
# four-loom before/after study on coarse open-end cotton weft (12s/14s Ne),
# plus machine-manual values from the literature review.

thresholds:
  # The plant's own CMPX targets, from the TT weaving KPI report of
  # 24-06-2026. CMPX at or above target is treated as elevated.
  # (All four study looms started far above the weft target: 51.3 / 97.3 /
  # 88 / 60.)
  pile_cmpx_target: 3.0
  ground_cmpx_target: 4.0
  weft_cmpx_target: 12.0
  source: "Plant KPI report, TT weaving, 24-06-2026"

# Per-case outcomes of the June 2025 study (the seed evidence base).
# The engine computes ranges/medians from cases; as observed interventions
# accumulate in the database they are added to this evidence and the
# predicted numbers tighten automatically.
evidence:
  plant_study:
    source: "PROJECT 1, Alok Industries air-jet weaving study, June 2025"
    cases:
      - { loom: "12", cmpx_before: 51.3, cmpx_after: 26.22, eff_before: 61.4, eff_after: 66.2 }
      - { loom: "03", cmpx_before: 97.27, cmpx_after: 42.8, eff_before: 57, eff_after: 62 }
      - { loom: "47", cmpx_before: 88, cmpx_after: 34, eff_before: 50, eff_after: 82 }
      - { loom: "17", cmpx_before: 60, cmpx_after: 30, eff_before: 57, eff_after: 68 }

profiles:
  coarse_oe_cotton:
    description: >
      Coarse open-end cotton weft, 10-16 Ne. The profile the plant study was
      run on. Coarse OE yarn is hairy: the air jet grips it well, so it needs
      a gentler launch than finer or smoother yarns.
    match:
      weft_material: cotton
      weft_spin: oe
      weft_count_ne: [10, 16]
    bands:
      main_pressure:        { min: 3.4, max: 3.5, hard_max: 4.5, unit: "kg/cm²" }
      tandem_pressure:      { min: 3.0, max: 3.2, unit: "kg/cm²" }
      sub_pressure:         { min: 5.5, max: 6.0, unit: "kg/cm²" }
      main_nozzle_height_mm: { min: 139, max: 139, unit: "mm" }
      sub_nozzle_spacing_mm: { min: 65, max: 65, unit: "mm" }
      sub_to_reed_gap_mm:   { min: 2.5, max: 3.0, unit: "mm" }
      shed_crossing_deg:    { min: 302, max: 312, unit: "deg" }

  # Placeholder: the study claims filament results but tabulated no data.
  # Smooth filament has almost no hairiness, so the cotton logic (less air for
  # hairier yarn) does NOT transfer. Bands stay empty until trials exist —
  # the engine will say so rather than guess.
  polyester_filament:
    description: "30 Den polyester filament weft — no tabulated trial data yet."
    match:
      weft_material: polyester
      weft_spin: filament
    bands: {}
